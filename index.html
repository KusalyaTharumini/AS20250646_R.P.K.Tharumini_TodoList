<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand mb-0 h1 fs-6 fw-bold">My To-Do List</span>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7 col-xl-5">

        <div class="card task-card shadow-sm border-0">
          <div class="card-body p-3 p-sm-4">

            <h1 class="h4 fw-bold text-center mb-1">Task Manager</h1>
            <p class="text-center text-muted small mb-4">Organize your tasks and stay productive.</p>

            <form id="taskForm" novalidate>
              <div class="input-group has-validation">
                <input type="text" id="taskInput" class="form-control"
                       placeholder="Enter a new task..." aria-label="New task" autocomplete="off">
                <button class="btn btn-primary" type="submit" id="addBtn">Add Task</button>
                <div class="invalid-feedback" id="errorMsg">Please enter a task. It cannot be empty.</div>
              </div>
            </form>

    
            <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
              <span class="small">Your tasks</span>
              <span class="badge bg-primary" id="taskCounter" aria-live="polite">0 remaining</span>
            </div>

            <div class="btn-group w-100 mb-3" role="group" aria-label="Filter tasks">
              <button type="button" class="btn btn-outline-primary btn-sm active" data-filter="all">All</button>
              <button type="button" class="btn btn-outline-primary btn-sm" data-filter="active">Active</button>
              <button type="button" class="btn btn-outline-primary btn-sm" data-filter="completed">Completed</button>
            </div>

            <ul class="list-group" id="taskList"></ul>
            <p class="text-center small text-muted my-3 d-none" id="emptyMsg">No tasks yet. Add your first task!</p>

            <div class="text-end mt-3">
              <button type="button" class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
